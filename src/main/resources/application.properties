spring.application.name=bank-management-system

spring.datasource.url=jdbc:h2:mem:bankms;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyInProdEnvUseAtLeast256BitsLongValueHere123456}
app.jwt.expiration-ms=86400000

# Interest accrual job: every day at 23:55 in prod; overridable for demo
bank.interest.cron=0 55 23 * * *
